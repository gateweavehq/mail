name: Deploy

# Gateweave Cloud's deploys. Every green build of main goes to staging, and publishing a release
# deploys that tag to production. Forks skip both jobs: they have no Cloudflare credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  staging:
    if: >-
      github.repository == 'gateweavehq/mail' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://mail-staging.gateweave.com
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, so the new code never meets an old schema.
      - name: Apply D1 migrations
        run: pnpm --filter @gateweave/mail-web db:migrate:staging
      - name: Deploy
        run: pnpm --filter @gateweave/mail-web deploy:staging

  production:
    if: github.repository == 'gateweavehq/mail' && github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds, applies D1 migrations, then deploys (apps/web/scripts/deploy.mjs), as self-hosters do,
      # to the Worker the top level of wrangler.jsonc names. It has no custom domain yet, so it answers
      # on workers.dev until one is added. `run` is needed: `pnpm deploy` is a built-in command.
      - name: Deploy
        run: pnpm --filter @gateweave/mail-web run deploy
