name: Deploy

# Gateweave Cloud's deploys. Every green build of main goes to staging, and publishing a release
# deploys that tag to production. Forks skip both jobs: they have no Cloudflare credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  staging:
    if: >-
      github.repository == 'gateweavehq/mail' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://mail-staging.gateweave.com
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, so the new code never meets an old schema.
      - name: Apply D1 migrations
        run: pnpm --filter @gateweave/mail-web db:migrate:staging
      - name: Deploy
        run: pnpm --filter @gateweave/mail-web deploy:staging

  production:
    if: github.repository == 'gateweavehq/mail' && github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mail.gateweave.com
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, so the new code never meets an old schema. The deploy script applies them
      # too, to the database CLOUDFLARE_ENV selects; here the environment is named, so a release
      # can't migrate another database than the one it is about to use.
      - name: Apply D1 migrations
        run: pnpm --filter @gateweave/mail-web db:migrate:cloud
      # Builds and deploys (apps/web/scripts/deploy.mjs), as self-hosters do, but with the `cloud`
      # environment of wrangler.jsonc, which the build, the script and Wrangler read from
      # CLOUDFLARE_ENV. `run` is needed: `pnpm deploy` is a built-in command.
      - name: Deploy
        env:
          CLOUDFLARE_ENV: cloud
        run: pnpm --filter @gateweave/mail-web run deploy
      # The deployment as a stranger finds it (apps/web/smoke): the sign-in page with its provider,
      # and /mcp and /api/v1 turning away whoever has no key. It signs in to nothing and changes
      # nothing. A failure here fails the release's deploy, so it is seen.
      - name: Smoke test
        run: pnpm test:smoke
        env:
          MAIL_SMOKE_URL: https://mail.gateweave.com
          MAIL_SMOKE_SSO: "1"
